<style>
:root{--navy:#172e7a;--gold:#ffd21a;--white:#fff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;color:var(--white);background:
 radial-gradient(circle at 18% 20%,rgba(52,75,112,.55),transparent 32%),

body:before{content:"";position:fixed;inset:-40px;background:
 radial-gradient(ellipse at 20% 30%,rgba(255,255,255,.09),transparent 30%),

main{position:relative;width:min(100%,520px);text-align:center;padding:34px 20px 40px}
h1{font-size:clamp(36px,9vw,56px);line-height:1.05;margin:8px 0 12px;font-weight:800;letter-spacing:-1px}
.subtitle{font-size:clamp(17px,4.5vw,23px);color:#e3e7f0;margin:0 0 28px}
.avatar{width:160px;height:160px;margin:0 auto 28px;border-radius:50%;display:grid;place-items:center;
 background:linear-gradient(145deg,#ffda45,#e89b18);padding:5px;box-shadow:0 12px 40px #0008}
.avatar-inner{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;
 background:linear-gradient(135deg,#283b72,#10192f);font-size:48px;font-weight:800}
.eyebrow{font-size:18px;color:#e4e6ec;margin:0 0 8px;text-transform:uppercase;letter-spacing:.5px}

.name{font-size:26px;font-weight:700;margin:0 0 16px}
.note{font-size:17px;color:#e1e5ee;margin:0 0 28px}
.join{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;min-height:94px;
 border:5px solid #fff;border-radius:60px;background:var(--navy);color:#fff;text-decoration:none;
 font-size:clamp(21px,5vw,27px);font-weight:800;padding:18px 24px;box-shadow:0 12px 28px #0005;
 transition:transform .15s,background .15s}
.join:active{transform:scale(.98)}.join:hover{background:#23439e}
.telegram{font-size:28px;flex:none}
.footer{display:inline-block;margin-top:34px;color:var(--gold);font-size:19px;font-weight:800;text-decoration:none}
.small{font-size:12px;color:#aeb7ca;margin-top:30px}

<script>
/* A simple visual countdown; it does not control Telegram access. */
let seconds = 15;
const display = document.getElementById('countdown');
const timer = setInterval(() => {
  seconds = Math.max(0, seconds - 1);
  display.textContent = seconds;
  if (seconds === 0) clearInterval(timer);
}, 1000);
</script>
