<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>Prince Sir | Toss Prediction Channel</title>
  <meta name="description" content="Join the Prince Sir Telegram channel for toss prediction updates.">
  <style>
    :root{color-scheme:dark;--gold:#e8bd62;--gold2:#ffe3a0;--ink:#090909;--muted:#b8b1a3}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 15%,#302311 0%,#15110b 34%,#080808 72%);color:#fff;font-family:Arial,Helvetica,sans-serif;display:grid;place-items:center;padding:24px}
    .wrap{width:min(100%,470px);text-align:center}
    .panel{position:relative;overflow:hidden;border:1px solid rgba(232,189,98,.55);border-radius:25px;padding:38px 25px 30px;background:linear-gradient(155deg,rgba(35,29,18,.97),rgba(10,10,10,.98) 60%);box-shadow:0 22px 80px rgba(0,0,0,.65),0 0 35px rgba(232,189,98,.10)}
    .panel:before{content:"";position:absolute;inset:9px;border:1px solid rgba(232,189,98,.16);border-radius:18px;pointer-events:none}
    .crown{font-size:36px;line-height:1;margin-bottom:15px;filter:drop-shadow(0 3px 12px rgba(232,189,98,.35))}
    .eyebrow{color:var(--gold);font-size:11px;letter-spacing:4px;font-weight:700;text-transform:uppercase}
    h1{margin:12px 0 7px;font-family:Georgia,serif;font-size:clamp(38px,10vw,54px);letter-spacing:2px;color:var(--gold2);text-shadow:0 2px 20px rgba(232,189,98,.17)}
    .rule{height:1px;width:90px;margin:18px auto 22px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
    h2{margin:0 auto 12px;max-width:330px;font-size:20px;line-height:1.45;letter-spacing:1.1px}
    .sub{margin:0 auto 27px;max-width:320px;color:var(--muted);font-size:14px;line-height:1.7}
    .join{display:flex;align-items:center;justify-content:center;gap:11px;width:100%;min-height:58px;padding:15px 18px;border:0;border-radius:12px;background:linear-gradient(100deg,#c99437,#ffe3a0 50%,#d5a447);color:#171109;text-decoration:none;font-size:16px;font-weight:800;letter-spacing:1.2px;box-shadow:0 8px 25px rgba(205,157,66,.22);transition:transform .15s ease,filter .15s ease}
    .join:active{transform:scale(.985);filter:brightness(.94)}
    .join svg{width:22px;height:22px;flex:none}
    .note{margin:17px 0 0;color:#928a7b;font-size:11px;line-height:1.5}
    footer{margin-top:18px;color:#777064;font-size:11px;letter-spacing:.5px}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
  <!-- Meta Pixel -->
  <script>
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}
    (window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init','1125369490130215');
    fbq('track','PageView');
  </script>
  <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1125369490130215&ev=PageView&noscript=1"
    alt=""></noscript>
</head>
<body>
  <main class="wrap">
    <section class="panel" aria-labelledby="brand">
      <div class="crown" aria-hidden="true">♛</div>
      <div class="eyebrow">Official Telegram Channel</div>
      <h1 id="brand">PRINCE SIR</h1>
      <div class="rule"></div>
      <h2>ONLY TOSS<br>PREDICTION CHANNEL</h2>
      <p class="sub">Get channel updates directly on Telegram. Tap below to visit and request to join.</p>
      <a class="join" id="joinButton" href="https://t.me/+1AhRlzYEYNdkYmI1" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.8 3.2 18.6 20c-.2 1.2-.9 1.5-1.8 1l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.3-8.4c.4-.4-.1-.6-.6-.2L6 13.6l-4.9-1.5c-1.1-.3-1.1-1 .2-1.5L20.4 3c.9-.3 1.7.2 1.4 1.2Z"/></svg>
        JOIN NOW TELEGRAM
      </a>
      <p class="note">You will be redirected to Telegram when you tap the button.</p>
    </section>
    <footer>© <span id="year"></span> PRINCE SIR</footer>
  </main>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    const joinButton = document.getElementById('joinButton');
    let joinTracked = false;
    joinButton.addEventListener('click', function () {
      if (!joinTracked) {
        joinTracked = true;
        if (typeof window.fbq === 'function') {
          window.fbq('track', 'Lead');
        }
      }
    });
  </script>
</body>
</html>
